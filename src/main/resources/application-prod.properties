# Profil produkcyjny ? bezpiecze?stwo
# Nigdy nie modyfikuj schematu automatycznie na produkcji
spring.jpa.hibernate.ddl-auto=validate

# Zabezpiecza przed przypadkowym wyczyszczeniem bazy przez Flyway
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true

# Jednorazowa naprawa historii Flyway po zmianie checksum istniejącej migracji.
# Na Railway ustaw tymczasowo FLYWAY_REPAIR_ON_STARTUP=true, uruchom deploy raz,
# a potem koniecznie usuń/ustaw z powrotem na false.
app.flyway.repair-on-startup=${FLYWAY_REPAIR_ON_STARTUP:false}
