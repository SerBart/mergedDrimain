spring:
  datasource:
    # URL jest ustawiany przez DatabaseUrlProcessor (EnvironmentPostProcessor) na podstawie:
    # 1. SPRING_DATASOURCE_URL (jeśli ustawiony ręcznie)
    # 2. DATABASE_URL (Railway, format postgresql://)
    # 3. PGHOST + PGPORT + PGDATABASE (Railway PG* zmienne)
    # Poniższa wartość to ostateczny fallback gdyby żadna zmienna nie była dostępna.
    url: jdbc:postgresql://localhost:5432/railway
    username: ${SPRING_DATASOURCE_USERNAME:${PGUSER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  jwt:
    secret: ${JWT_SECRET}
    access-expiration: ${JWT_ACCESS_TTL_MS:900000}
    refresh-expiration: ${JWT_REFRESH_TTL_MS:604800000}
  energy:
    ingest-key: ${ENERGY_INGEST_KEY:}
  cors:
    allowed-origins: "https://app.drimain.com,https://mergeddrimain-production.up.railway.app,https://*.up.railway.app"
  security:
    h2-console-enabled: false
    swagger-enabled: false
    hsts-enabled: true
    # CSP kompatybilny z Flutter Web (CanvasKit WASM + Service Worker + blob: URL-e)
    # WAŻNE: blob: (z dwukropkiem!) = schemat URL, nie hostname
    csp: "default-src 'self' https: data: blob:; script-src 'self' 'unsafe-eval' 'unsafe-inline' 'wasm-unsafe-eval' https: blob:; style-src 'self' 'unsafe-inline' https: blob:; img-src 'self' data: https: blob:; connect-src 'self' https: blob: wss:; worker-src 'self' blob:; font-src 'self' data: https:; frame-ancestors 'none';"
  admin:
    username: ${ADMIN_USERNAME:admin}
    force-reset: ${ADMIN_FORCE_RESET:false}
    password: ${ADMIN_PASSWORD:}

server:
  forward-headers-strategy: framework
  port: ${PORT:8080}
  address: 0.0.0.0
