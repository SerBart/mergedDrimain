# --- JWT ---
# Prefer app.jwt.secret (used by the app) and allow override from env
app.jwt.secret=${APP_JWT_SECRET:REPLACE_WITH_STRONG_SECRET_AT_LEAST_32_CHARS_LONG_1234567890}

# JJWT expects either 'jwt.secret.base64' or 'jwt.secret.plain' (as used in JwtService)
# Provide both with environment fallbacks so prod/dev work consistently.
jwt.secret.base64=${JWT_SECRET_BASE64:}
jwt.secret.plain=${JWT_SECRET_PLAIN:${APP_JWT_SECRET:super_tajny_klucz_dev_32+_znakow_!!!_123456}}

# Legacy alias kept for backward compatibility (not used by JwtService but harmless)
jwt.secret=${JWT_SECRET_BASE64:REPLACE_WITH_BASE64_SECRET_256bit_EXAMPLE_dGhpc0lzQVNlY3JldEtleVNlZWQhITIzNDU2Nzg5MA==}

# Optional legacy keys (keep for backward compatibility, overridable via env if needed)
jwt.expiration.minutes=${JWT_EXP_MINUTES:60}

# --- DataSource Configuration ---
# Fallback to embedded H2 (PostgreSQL compatibility mode) unless a proper datasource is provided by env.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/drimain;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.validation-timeout=${DB_POOL_VALIDATION_TIMEOUT_MS:5000}

# --- JPA + Hibernate ---
# Use update by default so that H2 fallback can initialize schema without Flyway.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=false

# --- Flyway ---
# Disable by default to avoid Postgres-specific migrations breaking H2 fallback. Enable on platforms with Postgres via FLYWAY_ENABLED=true.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.sql.init.mode=never

# --- H2 Console (dev only; harmless if not used) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Attachment Storage Configuration ---
# Use /tmp on Railway by default (writable on ephemeral FS), override via ATTACHMENTS_BASE_PATH if needed
app.attachments.base-path=${ATTACHMENTS_BASE_PATH:/tmp/uploads/attachments}
app.attachments.max-file-size-bytes=${ATTACHMENTS_MAX_SIZE:10485760}

# --- SSE Configuration ---
app.sse.max-clients=${SSE_MAX_CLIENTS:100}
app.sse.heartbeat-interval-seconds=${SSE_HEARTBEAT_SECONDS:30}
app.sse.client-timeout-seconds=${SSE_CLIENT_TIMEOUT_SECONDS:300}
app.energy.sse.heartbeat-interval-ms=${ENERGY_SSE_HEARTBEAT_MS:15000}
app.energy.sse.client-timeout-ms=${ENERGY_SSE_TIMEOUT_MS:180000}

# --- CORS ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000,http://localhost:5173}

# Spójny domyślny port lokalny, z możliwością nadpisania przez zmienną PORT
server.port=${PORT:8080}
